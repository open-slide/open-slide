appId: dev.open-slide.desktop
productName: open-slide
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - "!dist/**/*.map"
  - package.json
  # The agents' native CLIs are a few hundred MB each, so they are downloaded
  # on first sign-in instead (src/main/agent-cli.ts).
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!**/node_modules/@openai/codex-{darwin,linux,win32}-*/**"
  - "!**/node_modules/**/*.d.{ts,mts,cts}"
# Every dependency here is loaded by another process as plain files: the dev
# server imports the agent SDKs, the SDKs spawn the downloaded CLIs, and init
# runs the CLI. None of them can read inside app.asar, and neither can dlopen.
asarUnpack:
  - node_modules/**
  - dist/native/**
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target: [dmg, zip]
win:
  target: [nsis]
  icon: build/icon.png
linux:
  target: [AppImage]
  icon: build/icon.png
  category: Office
