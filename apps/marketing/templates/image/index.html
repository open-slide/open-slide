<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>__TITLE__</title>
<link rel="stylesheet" href="/out/fonts/_base/fonts.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #030304; }
  .frame {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; gap: 22px;
    padding: 0 88px;
    font-family: 'Geist', system-ui, sans-serif; color: #f5f5f6;
    background: radial-gradient(40% 60% at 85% 90%, oklch(0.6 0.21 25 / 0.28), transparent 70%);
  }
  .logo { width: 56px; height: 56px; border-radius: 12px; }
  h1 { font-size: 80px; font-weight: 600; letter-spacing: -0.055em; line-height: 1; }
  p { font-size: 26px; letter-spacing: -0.015em; color: rgb(255 255 255 / 0.56); }
</style>
</head>
<body>
<!-- Sized by the viewport: each output in image.js renders this page at its width × height.
     Real slides: <img src="/@deck/getting-started/3.png">. Brand assets: /@repo/<path>. -->
<div class="frame">
  <img class="logo" src="/@repo/apps/web/public/open-slide.png" alt="" />
  <h1>__TITLE__</h1>
  <p>The slide framework built for agents.</p>
</div>
</body>
</html>
